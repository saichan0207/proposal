<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>美ら三線サークル｜ホームページはこちらへ移りました</title>
<link rel="canonical" href="https://saichan0207.github.io/churasanshin/">
<meta http-equiv="refresh" content="0;url=https://saichan0207.github.io/churasanshin/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fefbf4;color:#1f4750;
       font-family:"Hiragino Sans","Yu Gothic",sans-serif;text-align:center;padding:24px;line-height:1.9}
  a{color:#0289a3;font-weight:700}
  /* ═══ 2026-08-21 追加：動きの4部品 ═══
     社長がお手本に挙げた3サイトに共通していた作りを、
     この業種に合う強さに落として入れている。硬派な演出は教室サイトには合わないので、
     速さと振れ幅は弱めにしてある。 */

  /* 1. 見出しを行ごとに立ち上げる（今までは要素ごと1回ふわっと出すだけだった） */
  .ln{display:block;overflow:hidden}
  .ln>i{display:block;font-style:normal;transform:translateY(105%);
    transition:transform 1.05s cubic-bezier(.19,1,.22,1)}
  .in .ln>i,.ln.in>i{transform:translateY(0)}
  .ln:nth-child(2)>i{transition-delay:.09s}
  .ln:nth-child(3)>i{transition-delay:.18s}
  html:not(.js) .ln>i{transform:none}

  /* 2. マウスの丸（保護者が見る画面なので、色は柔らかく・細く） */
  .cur{position:fixed;top:0;left:0;width:8px;height:8px;border-radius:50%;
    background:var(--gold);pointer-events:none;z-index:9999;
    transform:translate(-50%,-50%);opacity:.9}
  .cur-r{position:fixed;top:0;left:0;width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(179,147,76,.5);pointer-events:none;z-index:9998;
    transform:translate(-50%,-50%);
    transition:width .45s cubic-bezier(.22,1,.36,1),height .45s cubic-bezier(.22,1,.36,1),
      background .45s ease,border-color .45s ease}
  .cur-r.on{width:64px;height:64px;background:rgba(179,147,76,.10);border-color:rgba(179,147,76,.75)}
  @media (hover:none),(max-width:820px){.cur,.cur-r{display:none}}

  /* 3. 開いた瞬間。教室名がすっと出てから本編へ */
  #ld{position:fixed;inset:0;z-index:9990;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .7s ease,visibility .7s}
  #ld .ld-in{text-align:center;opacity:0;transform:translateY(10px);
    transition:opacity .9s ease,transform 1.1s cubic-bezier(.19,1,.22,1)}
  #ld.go .ld-in{opacity:1;transform:none}
  #ld .ld-n{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:clamp(17px,2.6vw,25px);letter-spacing:.16em;color:var(--navy)}
  #ld .ld-l{margin:15px auto 0;width:0;height:1px;background:var(--gold);
    transition:width 1.15s cubic-bezier(.5,0,.1,1) .18s}
  #ld.go .ld-l{width:min(190px,42vw)}
  #ld.done{opacity:0;visibility:hidden}
  body.ld-lock{overflow:hidden}
  @media(prefers-reduced-motion:reduce){
    #ld{display:none}
    .ln>i{transform:none;transition:none}
    .cur,.cur-r{display:none}
  }
  /* ═══ 追加ここまで ═══ */
</style>
</head>
<body class="ld-lock">
<div id="ld"><div class="ld-in">
  <div class="ld-n">美ら三線サークル</div>
  <div class="ld-l"></div>
</div></div>
  <div>
    <p>美ら三線サークル様のホームページは、正式公開にともない<br>新しい住所へ移りました。</p>
    <p><a href="https://saichan0207.github.io/churasanshin/">https://saichan0207.github.io/churasanshin/</a></p>
    <p style="font-size:13px;color:#5f7d85">数秒で自動的に移動します。移らない場合は上のリンクを押してください。</p>
  </div>
  <script>location.replace("https://saichan0207.github.io/churasanshin/");</script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script>
  /* ═══ 2026-08-21 追加：動きの4部品 ═══ */
  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* 開いた瞬間 → 本編へ。読み込みが速くても最低0.9秒は見せる（一瞬すぎると演出に見えない） */
    var ld = document.getElementById('ld');
    function openPage(){
      if(!ld) return;
      ld.classList.add('done');
      document.body.classList.remove('ld-lock');
      setTimeout(function(){ if(ld.parentNode) ld.parentNode.removeChild(ld); }, 800);
      lineIn(document.querySelector('.hero'));
    }
    if(reduce){ document.body.classList.remove('ld-lock'); }
    else {
      requestAnimationFrame(function(){ ld && ld.classList.add('go'); });
      var t0 = Date.now();
      window.addEventListener('load', function(){
        setTimeout(openPage, Math.max(0, 1500 - (Date.now() - t0)));
      });
      setTimeout(openPage, 4000);   /* 画像が重いときの保険 */
    }

    /* 見出しを行に割る。<br> をそのまま行の区切りとして使う */
    function splitH(el){
      if(!el || el.dataset.ln) return;
      var parts = el.innerHTML.split(/<br\s*\/?>/i);
      if(parts.length < 1) return;
      el.innerHTML = parts.map(function(x){
        return '<span class="ln"><i>' + x + '</i></span>';
      }).join('');
      el.dataset.ln = '1';
    }
    document.querySelectorAll('.hero h1, .sec-head h2, .method h2').forEach(splitH);

    function lineIn(scope){
      (scope || document).querySelectorAll('.ln').forEach(function(l){ l.classList.add('in'); });
    }

    /* 画面に入った見出しから順に立ち上げる */
    if('IntersectionObserver' in window && !reduce){
      var io2 = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(e.isIntersecting){ lineIn(e.target); io2.unobserve(e.target); }
        });
      }, {threshold:.2});
      document.querySelectorAll('.sec-head, .method h2').forEach(function(el){ io2.observe(el); });
      setTimeout(function(){ lineIn(document); }, 5000);   /* 保険 */
    } else {
      lineIn(document);
    }

    /* マウスの丸 */
    if(!reduce && window.matchMedia('(hover:hover)').matches){
      var d=document.createElement('div'); d.className='cur';
      var r=document.createElement('div'); r.className='cur-r';
      document.body.appendChild(d); document.body.appendChild(r);
      var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
      addEventListener('mousemove',function(e){
        mx=e.clientX; my=e.clientY;
        d.style.transform='translate('+mx+'px,'+my+'px) translate(-50%,-50%)';
      },{passive:true});
      (function loop(){
        rx+=(mx-rx)*.17; ry+=(my-ry)*.17;
        r.style.transform='translate('+rx+'px,'+ry+'px) translate(-50%,-50%)';
        requestAnimationFrame(loop);
      })();
      document.querySelectorAll('a,button,input,textarea,select,.card,.tg').forEach(function(el){
        el.addEventListener('mouseenter',function(){ r.classList.add('on'); });
        el.addEventListener('mouseleave',function(){ r.classList.remove('on'); });
      });
    }

    /* 慣性スクロール。ページ内リンクもここを通す */
    if(window.Lenis && !reduce){
      var le = new Lenis({duration:1.1, smoothWheel:true,
        easing:function(x){ return Math.min(1, 1.001 - Math.pow(2, -10*x)); }});
      requestAnimationFrame(function raf(t){ le.raf(t); requestAnimationFrame(raf); });
      document.querySelectorAll('a[href^="#"]').forEach(function(a){
        a.addEventListener('click',function(ev){
          var el=document.querySelector(a.getAttribute('href'));
          if(el){ ev.preventDefault(); le.scrollTo(el,{offset:-70,duration:1.3}); }
        });
      });
    }
  })();
  /* ═══ 追加ここまで ═══ */
</script>
</body>
</html>
