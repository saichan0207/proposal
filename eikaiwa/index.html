<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英会話カード">
<title>ヒューストン英会話カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 構成：上に進み具合 → 2つのタブ（場面で見る／カードで練習）。場面の見出しは米国の道路標識（緑の板）に見立てる */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#d9e1e7;
  --sign:#1f6a4a; --sign-ink:#ffffff; --accent:#2f56c9; --accent-soft:#e3e9fb;
  --say:#2f56c9; --hear:#b4561b; --hear-soft:#fbeadf; --ok:#1f7a4f; --ok-soft:#ddf1e6;
  --f-en:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-ja:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --ink:#e8eef2; --muted:#9aabb8; --line:#26333e;
  --sign:#2a7f5a; --sign-ink:#f4fff9; --accent:#8aa6ff; --accent-soft:#1d2a4d;
  --say:#8aa6ff; --hear:#f2a26e; --hear-soft:#3a2416; --ok:#6fd3a0; --ok-soft:#163626; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --ink:#e8eef2; --muted:#9aabb8; --line:#26333e;
  --sign:#2a7f5a; --sign-ink:#f4fff9; --accent:#8aa6ff; --accent-soft:#1d2a4d;
  --say:#8aa6ff; --hear:#f2a26e; --hear-soft:#3a2416; --ok:#6fd3a0; --ok-soft:#163626; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ja);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:640px;margin:0 auto}
header{padding-block:20px 8px}
h1{font-family:var(--f-ja);font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.prog b{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{flex:1;font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);margin:4px 0 12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.tag.say{color:var(--say);background:var(--accent-soft)}
.tag.hear{color:var(--hear);background:var(--hear-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.scene{margin-top:22px}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--sign);color:var(--sign-ink);border-radius:8px;padding:6px 14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 0 0 2px var(--sign)}
.sign .en{font-family:var(--f-en);font-weight:800;letter-spacing:.06em;font-size:13px;text-transform:uppercase;opacity:.85}
.sign .ja{font-weight:700;font-size:16px}
.pic{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pic svg{display:block;width:100%;height:auto}
.card .pic{width:100%;max-width:280px;margin:0 auto}
.scene p.lead{color:var(--muted);font-size:14px;margin:8px 0 6px}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:grid;grid-template-columns:44px 1fr 36px;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.item.done{opacity:.6}
.play{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent-soft);color:var(--accent);cursor:pointer;display:grid;place-items:center}
.play svg{width:20px;height:20px}
.txt{min-width:0}
.en-line{font-family:var(--f-en);font-weight:600;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.ja-line{font-size:15px;margin-top:2px}
.tip{font-size:13px;color:var(--muted);margin-top:4px}
.meta{margin-top:6px}
.check{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ok);cursor:pointer;display:grid;place-items:center;font-size:18px;font-weight:700}
.check[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
/* 練習 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;width:100%}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:700;padding:10px 6px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.card{margin-top:16px;border-radius:18px;border:2px solid var(--line);background:var(--bg);padding:22px 18px;min-height:230px;display:flex;flex-direction:column;gap:12px;justify-content:center;text-align:center}
.card .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .q{font-size:22px;font-weight:700;text-wrap:balance}
.card .q.en{font-family:var(--f-en);font-weight:600}
.card .a{border-top:1px dashed var(--line);padding-top:12px}
.card .a .en-line{font-size:22px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.big{font:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.big.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);grid-column:1/-1}
.big.ok{border-color:var(--ok);color:var(--ok)}
.listen{align-self:center}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.speed{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>ヒューストン英会話カード</h1>
    <p class="sub">アメリカの暮らしで毎日のように出る120フレーズ。中学英語で使える形だけ集めました。</p>
    <div class="prog"><div class="bar"><i id="barFill"></i></div><b id="progText">0 / 120 覚えた</b></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabList" aria-selected="true">場面で見る</button>
    <button class="tab" role="tab" id="tabPractice" aria-selected="false">カードで練習</button>
  </div>

  <section id="viewList">
    <div class="legend">
      <span><span class="tag say">言う</span> 自分が使う</span>
      <span><span class="tag hear">言われる</span> 相手から聞く・聞き取れればOK</span>
      <button class="speed" id="speedBtn" type="button">読み上げ：ゆっくり</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="scenes"></div>
  </section>

  <section id="viewPractice" hidden>
    <div class="panel">
      <div class="seg" role="group" aria-label="練習のしかた">
        <button type="button" id="modeSay" aria-pressed="true">日本語 → 英語で言う</button>
        <button type="button" id="modeHear" aria-pressed="false">英語を聞いて意味</button>
      </div>
      <div class="card" id="card"></div>
      <div class="btns" id="btns"></div>
      <p class="note">1回10枚。まだ「覚えた」にしていないものから出ます。声に出して言ってから答えを見るのがコツです。</p>
    </div>
  </section>
</div>

<script src="voice.js"></script>
<script src="illust.js"></script>

  ["What are you up to this weekend?","週末は何するの？","be up to＝〜をする予定","hear"],
  ["Not much.","特に何も","","say"],
  ["Sounds good.","いいね","誘われたときの返事にも","say"],
  ["I'm into cooking.","料理にハマっています","be into ~＝〜が好き・ハマっている","say"],
  ["Let's get together sometime.","今度集まろうよ","","say"],
  ["That's awesome!","すごいね！","相づちの定番","say"]]}
];
const ALL = []; SCENES.forEach((s,si)=>s.items.forEach((it,ii)=>ALL.push({id:si+'-'+ii,scene:si,en:it[0],ja:it[1],tip:it[2],who:it[3]})));

const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = new Set(store.get('done',[]));
let slow = store.get('slow',true);
let mode = store.get('mode','say');
let filter = -1;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SPK = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang)); voice = vs.find(v=>/Samantha|Google US|Aria|Jenny|Allison/i.test(v.name)) || vs[0] || null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let cur = null;
function play(x){
  const b64 = window.VOICE && window.VOICE[x.id];
  if(!b64) return speak(x.en);
  try{ if(cur) cur.pause(); cur = new Audio('data:audio/mpeg;base64,' + b64); cur.playbackRate = slow ? .8 : 1; cur.play().catch(()=>speak(x.en)); }catch(e){ speak(x.en); }
}
const byId = id => ALL.find(x=>x.id===id);
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate = slow ? .75 : 1; speechSynthesis.speak(u); }catch(e){}
}

function updateProg(){ $('barFill').style.width = (done.size/ALL.length*100)+'%'; $('progText').textContent = done.size+' / '+ALL.length+' 覚えた'; }
function toggleDone(id){ done.has(id)?done.delete(id):done.add(id); store.set('done',[...done]); updateProg(); }

function renderChips(){
  const c = $('chips');
  c.innerHTML = '<button class="chip" type="button" data-i="-1" aria-pressed="'+(filter<0)+'">ぜんぶ</button>' +
    SCENES.map((s,i)=>'<button class="chip" type="button" data-i="'+i+'" aria-pressed="'+(filter===i)+'">'+esc(s.ja)+'</button>').join('');
}
function renderList(){
  $('scenes').innerHTML = SCENES.map((s,si)=>{
    if(filter>=0 && filter!==si) return '';
    const rows = ALL.filter(x=>x.scene===si).map(x=>`
      <li class="item${done.has(x.id)?' done':''}" data-id="${x.id}">
        <button class="play" type="button" data-aid="${x.id}" aria-label="読み上げ：${esc(x.en)}">${SPK}</button>
        <div class="txt">
          <div class="en-line">${esc(x.en)}</div>
          <div class="ja-line">${esc(x.ja)}</div>
          ${x.tip?`<div class="tip">${esc(x.tip)}</div>`:''}
          <div class="meta"><span class="tag ${x.who}">${x.who==='say'?'言う':'言われる'}</span></div>
        </div>
        <button class="check" type="button" data-done="${x.id}" aria-pressed="${done.has(x.id)}" aria-label="覚えた">✓</button>
      </li>`).join('');
    return `<section class="scene"><div class="sign"><span class="en">${esc(s.en)}</span><span class="ja">${esc(s.ja)}</span></div>
      <div class="pic">${(window.ILLUST||[])[si]||''}</div>
      <p class="lead">${esc(s.lead)}</p><ul class="items">${rows}</ul></section>`;
  }).join('');
}

// 練習
let deck = [], pos = 0, shown = false;
function newDeck(){
  const pool = ALL.filter(x=> !done.has(x.id) && (mode==='say' ? x.who==='say' : true));
  const src = pool.length ? pool : ALL.filter(x=> mode==='say' ? x.who==='say' : true);
  deck = src.slice(0,10); pos = 0; shown = false; renderCard();
}
function renderCard(){
  const card = $('card'), btns = $('btns');
  if(pos >= deck.length){
    card.innerHTML = `<div class="count">おつかれさまでした</div><div class="q">${deck.length}枚おわり</div><div class="tip">「覚えた」は ${done.size} / ${ALL.length}</div>`;
    btns.innerHTML = `<button class="big primary" type="button" id="again">次の10枚</button>`;
    $('again').onclick = newDeck; return;
  }
  const x = deck[pos], n = `<div class="count">${pos+1} / ${deck.length}　・　${esc(SCENES[x.scene].ja)}</div><div class="pic">${(window.ILLUST||[])[x.scene]||''}</div>`;
  if(mode==='say'){
    card.innerHTML = n + `<div class="q">${esc(x.ja)}</div>` + (shown ? `<div class="a"><div class="en-line">${esc(x.en)}</div>${x.tip?`<div class="tip">${esc(x.tip)}</div>`:''}</div>` : '<div class="tip">英語で声に出して言ってみてください</div>');
  } else {
    card.innerHTML = n + `<button class="play listen" type="button" id="listenBtn" aria-label="もう一度聞く">${SPK}</button>` +
      (shown ? `<div class="a"><div class="en-line">${esc(x.en)}</div><div class="ja-line">${esc(x.ja)}</div>${x.tip?`<div class="tip">${esc(x.tip)}</div>`:''}</div>` : '<div class="tip">音を聞いて、意味を考えてみてください</div>');
    $('listenBtn').onclick = ()=>play(x);
  }
  if(!shown){
    btns.innerHTML = `<button class="big primary" type="button" id="reveal">こたえを見る</button>`;
    $('reveal').onclick = ()=>{ shown = true; renderCard(); play(x); };
  } else {
    btns.innerHTML = `<button class="big" type="button" id="retry">もう一回</button><button class="big ok" type="button" id="got">覚えた</button>`;
    $('retry').onclick = ()=>{ deck.push(x); pos++; shown=false; renderCard(); };
    $('got').onclick = ()=>{ if(!done.has(x.id)) toggleDone(x.id); pos++; shown=false; renderCard(); renderList(); };
  }
}
function setMode(m){ mode = m; store.set('mode',m); $('modeSay').setAttribute('aria-pressed', m==='say'); $('modeHear').setAttribute('aria-pressed', m==='hear'); newDeck(); if(m==='hear' && deck[0]) play(deck[0]); }

function setTab(p){
  $('tabList').setAttribute('aria-selected', !p); $('tabPractice').setAttribute('aria-selected', p);
  $('viewList').hidden = p; $('viewPractice').hidden = !p;
  if(p && !deck.length) newDeck();
}
function setSpeed(){ $('speedBtn').textContent = '読み上げ：' + (slow ? 'ゆっくり' : 'ふつう'); }

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.aid) play(byId(b.dataset.aid));
  if(b.dataset.done){ toggleDone(b.dataset.done); const li = b.closest('.item'); li.classList.toggle('done', done.has(b.dataset.done)); b.setAttribute('aria-pressed', done.has(b.dataset.done)); }
  if(b.classList.contains('chip')){ filter = +b.dataset.i; renderChips(); renderList(); }
});
$('tabList').onclick = ()=>setTab(false);
$('tabPractice').onclick = ()=>setTab(true);
$('modeSay').onclick = ()=>setMode('say');
$('modeHear').onclick = ()=>setMode('hear');
$('speedBtn').onclick = ()=>{ slow = !slow; store.set('slow',slow); setSpeed(); };

renderChips(); renderList(); updateProg(); setSpeed();
$('modeSay').setAttribute('aria-pressed', mode==='say'); $('modeHear').setAttribute('aria-pressed', mode==='hear');
</script>

</body>
</html>
